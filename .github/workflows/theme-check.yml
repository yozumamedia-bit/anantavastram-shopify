name: Theme Check
on:
  push:
  pull_request:
jobs:
  theme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i -g @shopify/cli@latest
      # JSON output turned into annotations, so offences show on the run summary without opening the logs.
      - run: shopify theme check --output json > theme-check.json 2> theme-check.err || true
      - run: |
          node -e '
            const fs = require("fs");
            const raw = fs.readFileSync("theme-check.json", "utf8");
            let files;
            try { files = JSON.parse(raw.slice(raw.indexOf("["))); } catch (e) {
              const dump = (raw + " | stderr: " + fs.readFileSync("theme-check.err", "utf8")).replace(/\s+/g, " ").slice(0, 3500);
              console.log(`::error::Could not parse theme check output: ${dump}`);
              process.exit(1);
            }
            const level = ["error", "warning", "notice"];
            let errors = 0;
            for (const f of files) for (const o of f.offenses) {
              if (o.severity === 0) errors++;
              const msg = `${o.check}: ${o.message}`.replace(/\r?\n/g, " ");
              console.log(`::${level[o.severity] || "notice"} file=${f.path},line=${(o.start_row ?? 0) + 1}::${msg}`);
            }
            console.log(`${errors} error(s)`);
            process.exit(errors ? 1 : 0);
          '
