name: Theme Check
on:
  push:
  pull_request:
jobs:
  theme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i -g @shopify/cli@latest
      - run: shopify theme check --fail-level error
